<!doctype html><meta charset="utf-8"><title>Graph engine manual test</title><style>body{font:14px Arial;margin:20px}canvas{width:80vw;height:70vh;border:1px solid #ccc}input{padding:8px;width:300px}</style><input id="expr" value="y = 2x + 1"><button id="add">Add Expression</button><button id="reset">Reset</button><p id="error"></p><p id="view"></p><canvas id="graph"></canvas><script src="../js/expression-parser.js"></script><script src="../js/graph-engine.js"></script><script>let es=[{id:'1',source:expr.value,color:'#c74440',visible:true}],g=HDC.GraphEngine.create(graph,{onViewportChange:v=>view.textContent=JSON.stringify(v)});function sync(){g.setExpressions(es);error.textContent=es.map(e=>{let p=HDC.ExpressionParser.parse(e.source);return p.ok?'':p.error.message}).join(' ')}add.onclick=()=>{es.push({id:Date.now()+'',source:'y = x^2',color:'#2d70b3',visible:true});sync()};expr.oninput=()=>{es[0].source=expr.value;sync()};reset.onclick=()=>g.resetView();sync()</script>
