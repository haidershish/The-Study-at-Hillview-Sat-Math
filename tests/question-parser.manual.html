<!doctype html><meta charset="utf-8"><title>Question parser manual test</title><style>body{font:14px Arial;max-width:900px;margin:30px auto}textarea{width:100%;height:300px}button{margin:5px;padding:8px}pre{background:#f3f4f6;padding:15px;white-space:pre-wrap}table{border-collapse:collapse}td,th{border:1px solid #ccc;padding:6px}</style>
<h1>Question parser manual test</h1><textarea id="input"></textarea><br><button id="parse">Parse Text</button><input id="file" type="file" accept=".docx"><pre id="json"></pre><table><thead><tr><th>Severity</th><th>Question</th><th>Field</th><th>Message</th></tr></thead><tbody id="issues"></tbody></table><script src="../vendor/mammoth.browser.min.js"></script><script src="../js/question-parser.js"></script><script>
const sample='[Question]\nID: ALG-001\nDomain: Algebra\nType: MCQ\n\n[Prompt]\nWhat is 2 + 2?\n\n[Options]\nA: 3\nB: 4\nC: 5\nD: 6\n\n[Correct Answer]\nB\n\n[End Question]\n\n[Question]\nID: GEO-001\nDomain: Geometry and Trigonometry\nType: SPR\n\n[Prompt]\nA circle has radius 2. What is its circumference?\n\n[Correct Answer]\n4pi\n\n[End Question]';input.value=sample;function show(r){json.textContent=JSON.stringify(r,null,2);issues.innerHTML=r.issues.map(i=>'<tr><td>'+i.severity+'</td><td>'+i.questionId+'</td><td>'+i.field+'</td><td>'+HDC.QuestionParser.escapeHtml(i.message)+'</td></tr>').join('')}parse.onclick=()=>show(HDC.QuestionParser.parseQuestionText(input.value));file.onchange=async()=>{try{show(await HDC.QuestionParser.importDocxFile(file.files[0]))}catch(e){json.textContent=e.message}}</script>
